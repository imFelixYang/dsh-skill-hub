# dsh-skill-hub bundle patch.
#
# Host half: registers exact /api/skill-hub/* fetch routes (sources, categories,
# search, detail, installed, install, uninstall, readme). Client half: claims the
# official `sidebar.panellist` + `main` seats, so the skill centre is a
# first-class panel rather than an overlay.
#
# Search runs across three kinds of source, queried in parallel:
#   skillhub  api.skillhub.tencent.com  (fast in mainland China)
#   clawhub   clawhub.ai                (the OpenClaw registry)
#   github    any repo laid out as <dir>/SKILL.md
#
# A fourth catalogue, the expert roster, is browsed rather than searched: it is
# served whole by /api/skill-hub/experts and stays out of keyword search.
- insert:
    - id: dsh-skill-hub
      name: 'dsh-skill-hub'
      config:
        skillhubApiBase: https://api.skillhub.tencent.com
        clawhubApiBase: https://clawhub.ai
        githubRepos: >-
          anthropics/skills@main,
          obra/superpowers@main,
          rohitg00/awesome-claude-code-toolkit@main,
          ComposioHQ/awesome-claude-skills@master
        expertsRepo: jnMetaCode/agency-agents-zh@main
        localSkillsDir: ''
        enableSkillHub: true
        enableClawHub: true
        enableGitHub: true
        enableExperts: true
